name: Temporary PulseX X-session integration

on:
  push:
    branches:
      - x-session-hardening

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/x-session-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for cleanup commit
        run: sleep 75

      - name: Create and merge protected-branch PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          pr="$(gh pr list \
            --repo "$repo" \
            --base main \
            --head x-session-hardening \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$pr" ]]; then
            gh pr create \
              --repo "$repo" \
              --base main \
              --head x-session-hardening \
              --title "Harden PulseX X session persistence" \
              --body "Adds encrypted rolling X-session persistence, proactive session validation and refresh, visible publish failures, publishing-capacity enforcement, recovery tooling, and publish diagnostics."

            pr="$(gh pr list \
              --repo "$repo" \
              --base main \
              --head x-session-hardening \
              --state open \
              --json number \
              --jq '.[0].number')"
          fi

          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          gh pr merge "$pr" --repo "$repo" --merge --delete-branch

      - name: Trigger deployed PulseX workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          sleep 5

          before="$(gh run list \
            --repo "$repo" \
            --workflow news.yml \
            --event workflow_dispatch \
            --branch main \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')"

          gh workflow run news.yml --repo "$repo" --ref main

          run_id=""
          for _ in $(seq 1 18); do
            candidate="$(gh run list \
              --repo "$repo" \
              --workflow news.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')"

            if [[ "$candidate" != "0" && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "Unable to locate the dispatched PulseX workflow run." >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched PulseX workflow run: $run_id"

      - name: Verify deployed PulseX run and rolling session
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          gh run watch "$RUN_ID" --repo "$repo" --exit-status --interval 5

          rm -rf /tmp/pulsex-output
          mkdir -p /tmp/pulsex-output
          gh run download "$RUN_ID" \
            --repo "$repo" \
            --name news-output \
            --dir /tmp/pulsex-output

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/pulsex-output/publish_log.json')
          if not path.exists():
              print('PUBLISH RESULT: no live post attempted in this cycle (safety capacity or no ready story).')
          else:
              rows = json.loads(path.read_text(encoding='utf-8'))
              errors = [row for row in rows if row.get('error')]
              posted = [row for row in rows if row.get('result')]
              if errors:
                  raise SystemExit(f'Publishing errors found: {errors}')
              print(f'PUBLISH RESULT: {len(posted)} story/stories successfully posted to X.')
          PY

          state_name="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$repo/contents/data/web_session.enc?ref=state" \
            --jq '.name')"

          test "$state_name" = "web_session.enc"
          echo "ROLLING SESSION: encrypted web_session.enc is present on state branch."
