name: Temporary PulseX hotfix integration

on:
  push:
    branches:
      - x-session-health-hotfix

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/x-session-health-hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for cleanup commit
        run: sleep 45

      - name: Create and merge hotfix PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          pr="$(gh pr list \
            --repo "$repo" \
            --base main \
            --head x-session-health-hotfix \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$pr" ]]; then
            gh pr create \
              --repo "$repo" \
              --base main \
              --head x-session-health-hotfix \
              --title "Fix PulseX X session validation on Actions" \
              --body "Replaces the overly strict headless preflight with structural/expiry validation while preserving authoritative live validation in the publisher, and surfaces sanitized X publish errors directly in Actions."

            pr="$(gh pr list \
              --repo "$repo" \
              --base main \
              --head x-session-health-hotfix \
              --state open \
              --json number \
              --jq '.[0].number')"
          fi

          gh pr merge "$pr" --repo "$repo" --merge --delete-branch

      - name: Trigger deployed PulseX workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 5
          gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main
