name: Temporary PR6 merger

on:
  push:
    branches:
      - automation-merge-pr6

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Merge proven X session PR 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge 6 --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      - name: Trigger PulseX after merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Delete temporary automation branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/automation-merge-pr6" || true
