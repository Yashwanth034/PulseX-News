name: Temporary branch cleanup

on:
  push:
    branches:
      - automation-clean-temp-branches

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/probe-x-compose-session" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/automation-clean-temp-branches" || true
