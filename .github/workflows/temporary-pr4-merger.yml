name: Temporary PR4 merger

on:
  push:
    branches:
      - automation-merge-pr4

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Merge cleanup PR 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge 4 --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      - name: Trigger PulseX after cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run news.yml --repo "$GITHUB_REPOSITORY" --ref main
