name: Temporary stale branch cleanup

on:
  push:
    branches:
      - automation-clean-stale-branches

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale helper branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/automation-merge-pr4" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/automation-merge-pr5" || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/automation-clean-stale-branches" || true
