name: PulseX — News Pipeline

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: pulsex-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore persistent state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            for file in news.db production_state.json web_session.enc; do
              git show "origin/state:data/${file}" > "data/${file}" 2>/dev/null || rm -f "data/${file}"
            done
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Run regression tests
        run: python -m src.regression_test

      - name: Run quality smoke test
        run: python -m src.test_quality

      - name: Collect, verify and prioritize
        run: python -m src.main

      - name: Show status
        run: python -m src.status

      - name: X dry run
        run: python -m src.dry_run

      # ---------------------------------------------------
      # SHOW CURRENTLY HELD STORIES
      #
      # This is diagnostic only.
      # It does NOT publish anything.
      # ---------------------------------------------------

      - name: Show held stories
        run: |
          python -c "import json; d=json.load(open('data/queue.json')); print(json.dumps(d.get('held', []), indent=2, ensure_ascii=False))"

      - name: Generate review dashboard
        run: python -m src.run_dashboard

      - name: Generate metrics
        run: python -m src.metrics

      - name: Safety health gate
        run: python -m src.health_gate

      - name: Restore X browser session
        id: x_session
        shell: bash
        env:
          X_WEB_SESSION: ${{ secrets.X_WEB_SESSION }}
          X_SESSION_ENCRYPTION_KEY: ${{ secrets.X_SESSION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          rm -f data/web_session.json

          # Preferred path: decrypt the rolling session saved on the state branch.
          if [[ -f data/web_session.enc && -n "${X_SESSION_ENCRYPTION_KEY:-}" ]]; then
            if python -m src.session_crypto decrypt data/web_session.enc data/web_session.json; then
              echo "source=rolling" >> "$GITHUB_OUTPUT"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::warning::Rolling X session could not be decrypted; falling back to X_WEB_SESSION bootstrap."
            rm -f data/web_session.json
          fi

          # Bootstrap/recovery path: repository secret captured manually from X.
          if [[ -z "${X_WEB_SESSION:-}" ]]; then
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::X posting skipped: no usable rolling session and X_WEB_SESSION is missing."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          session = json.loads(os.environ["X_WEB_SESSION"])
          cookies = session.get("cookies") if isinstance(session, dict) else None
          if not isinstance(cookies, list) or not cookies:
              raise SystemExit("X_WEB_SESSION is not a valid saved browser session")

          path = Path("data/web_session.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(session), encoding="utf-8")
          path.chmod(0o600)
          print("Bootstrap X browser session restored.")
          PY

          echo "source=bootstrap" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate X browser session structure
        if: steps.x_session.outputs.ready == 'true'
        run: python -m src.x_session_health

      - name: Production controller
        env:
          X_PUBLISH_ENABLED: ${{ steps.x_session.outputs.ready }}
          X_KILL_SWITCH: ${{ steps.x_session.outputs.ready == 'true' && 'false' || 'true' }}
          X_REQUIRE_HUMAN_REVIEW: "false"
          X_POST_METHOD: web
        run: python -m src.production_controller

      - name: Publish approved-quality posts to X
        id: publish_x
        if: steps.x_session.outputs.ready == 'true'
        env:
          X_PUBLISH_ENABLED: "true"
          X_KILL_SWITCH: "false"
          X_REQUIRE_HUMAN_REVIEW: "false"
          X_POST_METHOD: web
          X_HEADLESS: "true"
          X_BROWSER_CHANNEL: chrome
        run: python -m src.production_run

      - name: Surface X publish failure details
        if: failure() && steps.x_session.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def escape(value):
              return str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          path = Path('data/publish_log.json')
          if not path.exists():
              print('::error title=PulseX X publish failed::Publisher failed before publish diagnostics were written.')
              raise SystemExit(0)

          try:
              rows = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'::error title=PulseX X publish failed::Unable to read publish diagnostics: {escape(exc)}')
              raise SystemExit(0)

          errors = [row for row in rows if isinstance(row, dict) and row.get('error')]
          if not errors:
              print('::error title=PulseX X publish failed::Publisher exited unsuccessfully without an X error in publish_log.json.')
          else:
              for row in errors[:3]:
                  message = f"{row.get('title', 'Untitled story')}: {row.get('error')}"
                  print(f'::error title=PulseX X publish failed::{escape(message)}')
          PY

      - name: Preserve refreshed X browser session
        if: steps.x_session.outputs.ready == 'true' && success()
        shell: bash
        env:
          X_SESSION_ENCRYPTION_KEY: ${{ secrets.X_SESSION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${X_SESSION_ENCRYPTION_KEY:-}" ]]; then
            echo "::warning::Rolling X-session persistence is disabled until X_SESSION_ENCRYPTION_KEY is configured."
            exit 0
          fi

          python -m src.session_crypto encrypt data/web_session.json data/web_session.enc

      - name: Remove restored X browser session
        if: always()
        run: rm -f data/web_session.json

      - name: Human review report
        run: python -m src.review

      - name: Upload news output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: news-output
          path: |
            data/queue.json
            data/dashboard.html
            data/metrics.json
            data/health.json
            data/source_health.json
            data/publish_log.json
          retention-days: 1

      - name: Persist bot state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin state || true

          if git show-ref --verify --quiet refs/remotes/origin/state; then
            git worktree add /tmp/news-state origin/state
          else
            mkdir -p /tmp/news-state
            git -C /tmp/news-state init
            git -C /tmp/news-state checkout --orphan state
            git -C /tmp/news-state remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

          git -C /tmp/news-state remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git -C /tmp/news-state config user.name "github-actions[bot]"
          git -C /tmp/news-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/news-state/data
          state_files=()

          for file in news.db production_state.json web_session.enc; do
            if [[ -f "data/${file}" ]]; then
              cp "data/${file}" "/tmp/news-state/data/${file}"
              state_files+=("data/${file}")
            fi
          done

          cd /tmp/news-state

          if [[ "${#state_files[@]}" -eq 0 ]]; then
            exit 0
          fi

          # web_session.enc is intentionally ignored on main so it cannot be
          # accidentally committed there; force-add it only inside state worktree.
          git add -f -- "${state_files[@]}"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update news bot state"
          git push origin HEAD:state
